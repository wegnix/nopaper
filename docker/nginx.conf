# Log de acesso sem o que dá acesso: o token do link de assinatura some do caminho e a query
# (chaves ?k= e ?t= dos arquivos) não é gravada.
map $uri $np_log_uri {
  ~^/api/sign/  /api/sign/***;
  default       $uri;
}
log_format np '$remote_addr - [$time_local] "$request_method $np_log_uri" $status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /var/log/nginx/access.log np;
  client_max_body_size 20m;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 'ok'; }

  # envio de backup para restaurar (Plataforma → Restaurar backup → Do computador):
  # sem limite de tamanho e sem bufferizar em disco no nginx; a API limita e verifica
  location = /api/system/restore/upload {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # a API já envia estes cabeçalhos (helmet): esconde os dela para não sair duplicado
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  # envio do espaço para o contador (ZIP de notas fiscais): sem limite no nginx e sem bufferizar em
  # disco; a API limita cada arquivo (ACCOUNTING_MAX_UPLOAD_MB) e grava direto no destino
  location = /api/accounting/outbox {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_buffering off;
    # a API já envia estes cabeçalhos (helmet): esconde os dela para não sair duplicado
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # PWA: o service worker e o manifesto precisam ser revalidados sempre
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
